name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev appstream desktop-file-utils
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Validate packaging metadata
        run: |
          appstreamcli validate --no-net linux/packaging/io.github.evandro777.EasyCalc.metainfo.xml
          desktop-file-validate linux/packaging/io.github.evandro777.EasyCalc.desktop
